name: Calendar sync

# Mirrors the business Google Calendar into Supabase `cart_schedule` (SANITIZED — only events
# with Visibility="Public" keep a title/location; everything else becomes "Booked — Unavailable").
# The website's "Where We Vend" page reads that table, so this is what keeps glizzness.com/events
# current — including while Lance's PC is off and he's out working the cart.
#
# Runs sync_calendar.py unchanged: the service-account JSON arrives as a GitHub secret and is
# written to a temp file on the ephemeral runner, which GOOGLE_SA_KEYFILE points at.
#
# NOT SET UP YET? This job SKIPS cleanly (green, no email) until all three secrets exist. It
# starts working by itself once they're added.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SA_JSON        the FULL contents of the service-account JSON key
#   GOOGLE_CALENDAR_ID    the calendar id (often glizzness@gmail.com)
#   SUPABASE_SERVICE_KEY  Supabase service_role key (shared with the Signal Net crawler)
# See CALENDAR_SETUP.md.

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Guard FIRST — an unconfigured repo reports SUCCESS with a notice instead of emailing
      # a failure every 2 hours.
      - name: Check setup
        id: cfg
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
          CAL: ${{ secrets.GOOGLE_CALENDAR_ID }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SA" ] || [ -z "$CAL" ] || [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Calendar sync not set up yet::Missing one or more of GOOGLE_SA_JSON / GOOGLE_CALENDAR_ID / SUPABASE_SERVICE_KEY. Skipping this run — this is NOT a failure. Add the secrets per CALENDAR_SETUP.md and this starts working automatically."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-calendar.txt

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: pip install -r requirements-calendar.txt

      - name: Materialize the Google service-account key
        if: steps.cfg.outputs.configured == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$GOOGLE_SA_JSON" > "$RUNNER_TEMP/gcal-sa.json"

      - name: Sync Google Calendar -> Supabase
        if: steps.cfg.outputs.configured == 'true'
        env:
          GOOGLE_SA_KEYFILE: ${{ runner.temp }}/gcal-sa.json
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          SUPABASE_URL: https://ikhcbncnaojrndilmnnd.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_calendar.py

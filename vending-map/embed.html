<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Glizzness — Vending Circuit Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root { --bg:#16130f; --panel:#1f1b16; --ink:#f5efe6; --muted:#b9ad9b;
            --accent:#e8a33d; --green:#5bbf6a; --blue:#5aa7e0; --amber:#e0b14a; --red:#d0594f; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    #app { display: flex; flex-direction: column; height: 100%; }
    header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:1px solid #000; z-index:1000; }
    header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.2px; }
    header .dog { font-size:20px; }
    #crumb { color:var(--muted); font-size:13px; margin-left:auto; }
    /* filter bar */
    #filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px;
                 padding:8px 14px; background:#1a1712; border-bottom:1px solid #000; z-index:1000; }
    #filterbar .fb-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
    #filterbar select, #filterbar button { background:#2a241c; color:var(--ink);
                 border:1px solid #3a342c; border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; cursor:pointer; }
    #filterbar label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }
    #filterbar #f-reset { margin-left:auto; }
    #main { flex:1; position:relative; }
    #map { position:absolute; inset:0; }
    /* detail drawer */
    #drawer { position:absolute; top:0; right:0; width:min(380px,90vw); height:100%;
              background:var(--panel); border-left:1px solid #000; transform:translateX(105%);
              transition:transform .22s ease; z-index:1200; overflow-y:auto; padding:18px; }
    #drawer.open { transform:translateX(0); }
    #drawer .close { float:right; cursor:pointer; color:var(--muted); font-size:22px; line-height:1; border:none; background:none; }
    #drawer h2 { margin:0 28px 4px 0; font-size:18px; }
    #drawer .loc { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; margin:0 6px 6px 0; }
    .b-green{background:var(--green);color:#06210b;} .b-blue{background:var(--blue);color:#04223a;}
    .b-amber{background:var(--amber);color:#2a1e02;} .b-red{background:var(--red);color:#2a0a07;}
    .b-grey{background:#3a342c;color:var(--muted);}
    #drawer dl { margin:14px 0 0; font-size:14px; }
    #drawer dt { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin-top:12px; }
    #drawer dd { margin:2px 0 0; }
    #drawer a { color:var(--accent); }
    #drawer .home { display:inline-block; margin-top:16px; background:var(--accent); color:#1a1206;
                    text-decoration:none; font-weight:700; padding:9px 14px; border-radius:7px; }
    .legend { position:absolute; bottom:14px; left:14px; background:var(--panel); border:1px solid #000;
              border-radius:8px; padding:10px 12px; font-size:12px; z-index:1000; }
    .legend .row { display:flex; align-items:center; gap:7px; margin:3px 0; }
    .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
    /* event marker dots (clustered) */
    .evt-dot span { display:block; width:14px; height:14px; border-radius:50%; border:1px solid #000; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
    .leaflet-popup-content { font-size:13px; }
    #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:var(--panel);
              border:1px solid #000; border-radius:8px; padding:8px 14px; font-size:13px; z-index:1100; }
    /* mobile polish */
    @media (max-width:560px) {
      header { padding:8px 10px; gap:8px; }
      header h1 { font-size:14px; }
      #crumb { font-size:11px; }
      #drawer { width:100%; }
      #filterbar { gap:6px; padding:6px 10px; }
      #filterbar .fb-label { display:none; }
      #filterbar select, #filterbar button { padding:5px 6px; font-size:12px; }
      #filterbar #f-reset { margin-left:0; }
      .legend { font-size:11px; padding:8px 10px; bottom:10px; left:10px; max-width:62vw; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="dog">🌭</span>
      <h1>The Glizzness — Vending Circuit</h1>
      <span id="crumb"></span>
    </header>
    <div id="filterbar">
      <span class="fb-label">Filter</span>
      <select id="f-month" aria-label="Month"><option value="all">Any month</option></select>
      <select id="f-friendly" aria-label="Food-truck fit">
        <option value="all">Any fit</option>
        <option value="explicit_yes">Food-truck friendly</option>
        <option value="concession_friendly">Concession friendly</option>
        <option value="unconfirmed">Unconfirmed</option>
      </select>
      <select id="f-trip" aria-label="Trip type">
        <option value="all">Any trip</option>
        <option value="hometown">Hometown</option>
        <option value="day_trip">Day trip</option>
        <option value="overnight">Overnight</option>
      </select>
      <select id="f-county" aria-label="County"><option value="all">Any county</option></select>
      <label><input type="checkbox" id="f-hidden" /> Show defunct/excluded</label>
      <button id="f-reset">Reset</button>
    </div>
    <div id="main">
      <div id="map"></div>
      <div id="status">Loading…</div>
      <div class="legend">
        <div class="row"><span class="dot" style="background:#5bbf6a"></span> Food-truck friendly</div>
        <div class="row"><span class="dot" style="background:#5aa7e0"></span> Concession friendly</div>
        <div class="row"><span class="dot" style="background:#e0b14a"></span> Unconfirmed — verify</div>
        <div class="row"><span class="dot" style="background:#d0594f"></span> Defunct / excluded (toggle on)</div>
        <div class="row" style="margin-top:6px; color:var(--muted); font-size:11px;">Zoom in to scatter, out to group. Pins show the city/area, not exact addresses.</div>
      </div>
      <aside id="drawer">
        <button class="close" aria-label="Close">×</button>
        <div id="drawer-body"></div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>

// public SELECT RLS policies, and the accounting tables have NO policies (stay blocked).
// Fill in SUPABASE_ANON_KEY from: Supabase dashboard -> Project Settings -> API -> "anon public".
window.SUPABASE_URL = "https://ikhcbncnaojrndilmnnd.supabase.co";
window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlraGNibmNuYW9qcm5kaWxtbm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDc5NjYsImV4cCI6MjA5NzI4Mzk2Nn0.pOUaGdf2KA5a26UbR4V5TSkZAzoIEjA4UWKqZvsGOx4";

</script>
  <script>
/* The Glizzness — Vending Circuit map (zoom-based marker clustering).
   Every event is a colored dot in a single Leaflet.markercluster layer: dots group
   into numbered bubbles when zoomed out and scatter into individual dots when zoomed in.
   Click a bubble to zoom in; click a dot for the detail drawer.
   Reads Supabase REST with the public anon key (vending_* tables have public-read RLS).
   Filters: month / friendliness / trip-type / county + a defunct/excluded toggle. */

const URL = window.SUPABASE_URL, KEY = window.SUPABASE_ANON_KEY;
const HEADERS = { apikey: KEY, Authorization: "Bearer " + KEY };

const statusEl = document.getElementById("status");
const crumbEl  = document.getElementById("crumb");
const drawer   = document.getElementById("drawer");
const drawerBody = document.getElementById("drawer-body");

let EVENTS = [], monthsByEvent = {};
const FILT = { month: "all", friendly: "all", trip: "all", county: "all", showHidden: false };

const map = L.map("map", { zoomControl: true }).setView([38.7, -92.3], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

// one cluster layer for all event dots — groups/scatters by zoom automatically
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 55,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  chunkedLoading: true
}).addTo(map);

async function fetchJSON(path) {
  const res = await fetch(URL + "/rest/v1/" + path, { headers: HEADERS });
  if (!res.ok) throw new Error(res.status + " " + res.statusText + " — " + (await res.text()));
  return res.json();
}

// ---------- publish gate + filtering ----------
// "Published" mirrors the Supabase vending_published_events gate. Anything else
// (defunct / excluded) is hidden unless the user toggles it on.
const isPublished = e =>
  (e.verification_status === "verified" || e.verification_status === "partial")
  && e.food_truck_friendly !== "excluded";
const isHidden = e => !isPublished(e);

function passesFilter(e) {
  if (e.lat == null || e.lng == null) return false;
  if (!FILT.showHidden && isHidden(e)) return false;
  if (FILT.friendly !== "all" && e.food_truck_friendly !== FILT.friendly) return false;
  if (FILT.trip !== "all" && e.trip_type !== FILT.trip) return false;
  if (FILT.county !== "all" && (e.county || "") + "|" + (e.state || "") !== FILT.county) return false;
  if (FILT.month !== "all") {
    const ms = monthsByEvent[e.id] || [];
    // year-round / recurring events carry no month -> they match any month filter.
    if (ms.length && !ms.includes(Number(FILT.month))) return false;
  }
  return true;
}
const visibleEvents = () => EVENTS.filter(passesFilter);

const friendlyColor = e => {
  if (isHidden(e)) return "#d0594f";            // red — defunct / excluded
  const f = e.food_truck_friendly;
  return f === "explicit_yes" ? "#5bbf6a" : f === "unconfirmed" ? "#e0b14a" : "#5aa7e0";
};
const dotIcon = color => L.divIcon({
  className: "evt-dot", iconSize: [16, 16], iconAnchor: [8, 8],
  html: `<span style="background:${color}"></span>`
});

function setStatus(msg) { statusEl.textContent = msg; statusEl.style.display = msg ? "block" : "none"; }

// ---------- render all visible events into the cluster layer ----------
function render(fit) {
  clusterGroup.clearLayers();
  const vis = visibleEvents();
  const markers = [], pts = [];
  vis.forEach(e => {
    if (e.lat == null || e.lng == null) return;
    const mk = L.marker([e.lat, e.lng], { icon: dotIcon(friendlyColor(e)) })
      .bindTooltip(esc(e.name), { direction: "top" });
    mk.on("click", () => openDrawer(e));
    markers.push(mk);
    pts.push([e.lat, e.lng]);
  });
  clusterGroup.addLayers(markers);
  crumbEl.textContent = `${vis.length} event${vis.length === 1 ? "" : "s"}`;
  if (fit && pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
}
const applyFilters = () => render(true);

// ---------- detail drawer ----------
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);
function badge(text, cls) { return `<span class="badge ${cls}">${esc(text)}</span>`; }

function openDrawer(e) {
  const friendly = {
    explicit_yes:  badge("Food-truck friendly", "b-green"),
    concession_friendly: badge("Concession friendly", "b-blue"),
    unconfirmed:   badge("Food fit unconfirmed", "b-amber"),
    excluded:      badge("Not food-truck", "b-red")
  }[e.food_truck_friendly] || "";
  const statusB = e.verification_status === "defunct" ? badge("Defunct", "b-red")
    : (e.verification_status === "excluded" || e.food_truck_friendly === "excluded")
      ? badge("Excluded — not vending", "b-red") : "";
  const verify = e.needs_confirmation === true || e.needs_confirmation === "true"
    ? badge("Verify before relying", "b-amber") : "";
  const typeB = badge((e.event_type || "").replace(/_/g, " "), "b-grey");

  const rows = [];
  const add = (label, val) => { if (val) rows.push(`<dt>${esc(label)}</dt><dd>${esc(val)}</dd>`); };
  add("When", e.typical_dates || e.month);
  add("Size / attendance", e.attendance_text);
  add("Distance from Columbia", e.distance_from_columbia_mi ? e.distance_from_columbia_mi + " mi (" + (e.trip_type || "").replace("_", " ") + ")" : "");
  add("Apply via", e.application_method);
  const contact = [e.contact_name, e.contact_email, e.contact_phone].filter(Boolean).join(" · ");
  add("Contact", contact);
  add("Fee", e.food_vendor_fee && e.food_vendor_fee !== "Not researched" ? e.food_vendor_fee : "");
  add("Notes", e.notes);

  let home = "";
  if (e.homepage_url) {
    const url = /^https?:\/\//.test(e.homepage_url) ? e.homepage_url : "https://" + e.homepage_url;
    home = `<a class="home" href="${esc(url)}" target="_blank" rel="noopener">Event page ↗</a>`;
  }

  const countyTxt = e.county ? " · " + esc(e.county) + (/city$/i.test(e.county) ? "" : " County") : "";
  drawerBody.innerHTML = `
    <h2>${esc(e.name)}</h2>
    <div class="loc">${esc(e.city)}, ${esc(e.state)}${countyTxt}</div>
    <div>${typeB}${friendly}${statusB}${verify}</div>
    <dl>${rows.join("")}</dl>
    ${home}`;
  drawer.classList.add("open");
}

document.querySelector("#drawer .close").addEventListener("click", () => drawer.classList.remove("open"));

// ---------- filter controls ----------
const MONTH_NAMES = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function wireFilters() {
  const monthSel = document.getElementById("f-month");
  for (let i = 1; i <= 12; i++) {
    const o = document.createElement("option");
    o.value = String(i); o.textContent = MONTH_NAMES[i];
    monthSel.appendChild(o);
  }
  // County options: distinct (county, state) present in the data, sorted state-then-county.
  const countySel = document.getElementById("f-county");
  const seenCty = new Set();
  EVENTS.forEach(e => { if (e.county) seenCty.add(e.county + "|" + (e.state || "")); });
  [...seenCty].sort((a, b) => {
    const [ca, sa] = a.split("|"), [cb, sb] = b.split("|");
    return sa === sb ? ca.localeCompare(cb) : sa.localeCompare(sb);
  }).forEach(key => {
    const [cty, st] = key.split("|");
    const o = document.createElement("option");
    o.value = key; o.textContent = `${cty} (${st})`;
    countySel.appendChild(o);
  });
  const bind = (elId, key) => {
    const el = document.getElementById(elId);
    el.addEventListener("change", () => { FILT[key] = el.value; applyFilters(); });
  };
  bind("f-month", "month");
  bind("f-friendly", "friendly");
  bind("f-trip", "trip");
  bind("f-county", "county");
  document.getElementById("f-hidden").addEventListener("change", e => {
    FILT.showHidden = e.target.checked; applyFilters();
  });
  document.getElementById("f-reset").addEventListener("click", () => {
    FILT.month = "all"; FILT.friendly = "all"; FILT.trip = "all"; FILT.county = "all"; FILT.showHidden = false;
    monthSel.value = "all";
    document.getElementById("f-friendly").value = "all";
    document.getElementById("f-trip").value = "all";
    countySel.value = "all";
    document.getElementById("f-hidden").checked = false;
    applyFilters();
  });
}

// ---------- boot ----------
(async function init() {
  if (!KEY || KEY.includes("PASTE_YOUR")) {
    setStatus("⚠ Set SUPABASE_ANON_KEY in config.js to load data."); return;
  }
  try {
    setStatus("Loading…");
    let schedules;
    [EVENTS, schedules] = await Promise.all([
      fetchJSON("vending_events?select=*&lat=not.is.null&order=id"),
      fetchJSON("vending_event_schedules?select=event_id,month")
    ]);
    monthsByEvent = {};
    schedules.forEach(s => {
      if (s.month == null) return;
      (monthsByEvent[s.event_id] = monthsByEvent[s.event_id] || []).push(Number(s.month));
    });
    wireFilters();
    setStatus("");
    render(true);
  } catch (err) {
    setStatus("Load error: " + err.message);
    console.error(err);
  }
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/festivals/" />
  <title>Midwest Event Finder — The Glizzness</title>
  <meta name="description" content="Find events worth vending at or attending across the Midwest — festivals, fairs, breweries, races and more, centered on Columbia, Missouri. Filter by month, distance, and event type." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root { --bg:#16130f; --panel:#1f1b16; --ink:#f5efe6; --muted:#b9ad9b;
            --accent:#e8a33d; --green:#5bbf6a; --blue:#5aa7e0; --amber:#e0b14a; --red:#d0594f; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    #app { display: flex; flex-direction: column; height: 100%; }
    header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:1px solid #000; z-index:1000; }
    header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.2px; }
    header .dog { font-size:20px; }
    #crumb { color:var(--muted); font-size:13px; margin-left:auto; }
    /* filter bar */
    #filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px;
                 padding:8px 14px; background:#1a1712; border-bottom:1px solid #000; z-index:1000; }
    #filterbar .fb-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
    #filterbar select, #filterbar button { background:#2a241c; color:var(--ink);
                 border:1px solid #3a342c; border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; cursor:pointer; }
    #filterbar label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }
    #filterbar #f-reset { margin-left:auto; }
    #main { flex:1; position:relative; }
    #map { position:absolute; inset:0; }
    /* detail drawer */
    #drawer { position:absolute; top:0; right:0; width:min(380px,90vw); height:100%;
              background:var(--panel); border-left:1px solid #000; transform:translateX(105%);
              transition:transform .22s ease; z-index:1200; overflow-y:auto; padding:18px; }
    #drawer.open { transform:translateX(0); }
    #drawer .close { float:right; cursor:pointer; color:var(--muted); font-size:22px; line-height:1; border:none; background:none; }
    #drawer h2 { margin:0 28px 4px 0; font-size:18px; }
    #drawer .loc { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; margin:0 6px 6px 0; }
    .b-green{background:var(--green);color:#06210b;} .b-blue{background:var(--blue);color:#04223a;}
    .b-amber{background:var(--amber);color:#2a1e02;} .b-red{background:var(--red);color:#2a0a07;}
    .b-grey{background:#3a342c;color:var(--muted);}
    #drawer dl { margin:14px 0 0; font-size:14px; }
    #drawer dt { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin-top:12px; }
    #drawer dd { margin:2px 0 0; }
    #drawer a { color:var(--accent); }
    #drawer .home { display:inline-block; margin-top:16px; background:var(--accent); color:#1a1206;
                    text-decoration:none; font-weight:700; padding:9px 14px; border-radius:7px; }
    .legend { position:absolute; bottom:14px; left:14px; background:var(--panel); border:1px solid #000;
              border-radius:8px; padding:10px 12px; font-size:12px; z-index:1000; }
    .legend .row { display:flex; align-items:center; gap:7px; margin:3px 0; }
    .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
    /* event marker dots (clustered) */
    .evt-dot span { display:block; width:14px; height:14px; border-radius:50%; border:1px solid #000; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
    /* list-view toggle + panel */
    #list-toggle { cursor:pointer; background:#2a241c; color:var(--ink); border:1px solid #3a342c;
                   border-radius:6px; padding:6px 10px; font-weight:600; font-size:13px; }
    #list-toggle.active { background:var(--accent); color:#1a1206; border-color:var(--accent); }
    #listpanel { position:absolute; top:0; left:0; width:min(330px,85vw); height:100%; background:var(--panel);
                 border-right:1px solid #000; transform:translateX(-105%); transition:transform .22s ease;
                 z-index:1150; overflow-y:auto; }
    #listpanel.open { transform:translateX(0); }
    .lp-head { position:sticky; top:0; background:var(--panel); padding:11px 14px; border-bottom:1px solid #000;
               font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
    #lp-count { color:var(--muted); font-weight:400; font-size:12px; margin-left:auto; }
    .lp-close { cursor:pointer; color:var(--muted); background:none; border:none; font-size:20px; line-height:1; }
    .lp-row { display:block; width:100%; text-align:left; background:none; border:none; font-family:inherit;
              border-bottom:1px solid #2a241c; padding:9px 14px; cursor:pointer; color:var(--ink); }
    .lp-row:hover { background:#2a241c; }
    .lp-row.lp-past { opacity:.6; }
    .lp-passed { color:var(--amber); font-weight:600; }
    .lp-onetime { color:var(--blue); font-weight:600; }
    .lp-row .nm { font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
    .lp-row .sub { color:var(--muted); font-size:11px; margin:2px 0 0 18px; }
    .lp-dot { width:11px; height:11px; border-radius:50%; border:1px solid #000; flex:none; }
    .lp-empty { padding:16px 14px; color:var(--muted); font-size:13px; }
    .leaflet-popup-content { font-size:13px; }
    #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:var(--panel);
              border:1px solid #000; border-radius:8px; padding:8px 14px; font-size:13px; z-index:1100; }
    /* multi-select event-type dropdown */
    .ms { position:relative; }
    .ms-btn[aria-expanded="true"] { border-color:var(--accent); }
    .ms-panel { position:absolute; top:calc(100% + 4px); left:0; z-index:1300; background:var(--panel);
                border:1px solid #3a342c; border-radius:8px; padding:8px; min-width:210px; max-height:320px;
                overflow-y:auto; box-shadow:0 8px 26px rgba(0,0,0,.55); }
    .ms-panel[hidden] { display:none; }
    .ms-actions { display:flex; gap:8px; margin:0 0 6px; }
    .ms-actions button { flex:1; }
    #ms-list label { display:flex; align-items:center; gap:7px; padding:4px; font-size:13px; color:var(--ink);
                     white-space:nowrap; cursor:pointer; border-radius:4px; }
    #ms-list label:hover { background:#2a241c; }
    /* mobile polish */
    @media (max-width:560px) {
      header { padding:8px 10px; gap:8px; }
      header h1 { font-size:14px; }
      #crumb { font-size:11px; }
      #drawer { width:100%; }
      #listpanel { width:100%; }
      #filterbar { gap:6px; padding:6px 10px; }
      #filterbar .fb-label { display:none; }
      #filterbar select, #filterbar button { padding:5px 6px; font-size:12px; }
      #filterbar #f-reset { margin-left:0; }
      .legend { font-size:11px; padding:8px 10px; bottom:10px; left:10px; max-width:62vw; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="dog">🌭</span>
      <h1>Midwest Event Finder</h1>
      <button id="list-toggle" aria-label="List view">☰ List</button>
      <span id="crumb"></span>
    </header>
    <div id="filterbar">
      <span class="fb-label">Filter</span>
      <select id="f-month" aria-label="Month"><option value="all">Any month</option></select>
      <select id="f-distance" aria-label="Distance from Columbia">
        <option value="all">Any distance</option>
        <option value="50">Within 50 mi</option>
        <option value="100">Within 100 mi</option>
        <option value="150">Within 150 mi</option>
        <option value="250">Within 250 mi</option>
      </select>
      <select id="f-county" aria-label="County"><option value="all">Any county</option></select>
      <div class="ms" id="ms-type">
        <button type="button" class="ms-btn" id="ms-btn" aria-expanded="false">All types ▾</button>
        <div class="ms-panel" id="ms-panel" hidden>
          <div class="ms-actions"><button type="button" id="ms-all">All</button><button type="button" id="ms-none">None</button></div>
          <div id="ms-list"></div>
        </div>
      </div>
      <button id="f-reset">Reset</button>
    </div>
    <div id="main">
      <div id="map"></div>
      <div id="status">Loading…</div>
      <div class="legend">
        <div class="row" style="color:var(--muted); font-size:11px;">Zoom in to scatter, out to group. Pins show the city/area, not exact addresses.</div>
      </div>
      <aside id="listpanel">
        <div class="lp-head">Events in view <span id="lp-count"></span>
          <button class="lp-close" aria-label="Close">×</button></div>
        <div id="list-body"></div>
      </aside>
      <aside id="drawer">
        <button class="close" aria-label="Close">×</button>
        <div id="drawer-body"></div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
